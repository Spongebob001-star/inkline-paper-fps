<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨线突围 · 内核客户端（D5 开发版：全能力+全敌人）</title>
<style>
  :root { --paper:#F3F1E7; --ink:#20242A; --teal:#007F7B; --red:#E34B3F; --yellow:#F2C14E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--paper); font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink); }
  #view { width:100%; height:100%; display:block; cursor:crosshair; }
  #hud { position:fixed; inset:0; pointer-events:none; user-select:none; }
  #hud-top { position:absolute; top:14px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; }
  .vrow { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .vlabel { font-size:12px; width:28px; opacity:.75; }
  .vbar { width:180px; height:10px; background:rgba(32,36,42,.15); border:1px solid rgba(32,36,42,.4); }
  .vbar > div { height:100%; transition:width .12s linear; }
  #hp-fill { background:var(--red); width:100%; }
  #ink-fill { background:var(--teal); width:100%; }
  .vrow span:last-child { font-size:12px; font-variant-numeric:tabular-nums; width:30px; }
  #hud-right { text-align:right; }
  #timer { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  #kills { font-size:13px; opacity:.8; }
  #grace-banner { position:absolute; top:64px; left:50%; transform:translateX(-50%); background:rgba(242,193,78,.9); border:1px solid var(--ink); padding:4px 14px; font-size:13px; display:none; }
  #crosshair { position:absolute; left:50%; top:50%; width:0; height:0; }
  #crosshair::before, #crosshair::after { content:""; position:absolute; background:var(--ink); }
  #crosshair::before { width:14px; height:2px; left:-7px; top:-1px; }
  #crosshair::after { width:2px; height:14px; left:-1px; top:-7px; }
  #hitmark { position:absolute; left:-9px; top:-9px; width:18px; height:18px; opacity:0; }
  #hitmark::before, #hitmark::after { content:""; position:absolute; left:8px; top:0; width:2.5px; height:18px; background:var(--red); }
  #hitmark::before { transform:rotate(45deg); }
  #hitmark::after { transform:rotate(-45deg); }
  #hud-ammo { position:absolute; right:22px; bottom:20px; text-align:right; }
  #ammo-num { font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; }
  #ammo-cap { font-size:16px; opacity:.6; }
  #reload-bar { width:120px; height:6px; background:rgba(32,36,42,.15); border:1px solid rgba(32,36,42,.4); margin-top:4px; display:none; }
  #reload-fill { height:100%; background:var(--yellow); width:0; }
  #reload-text { font-size:12px; color:var(--yellow); text-shadow:0 0 3px var(--ink); display:none; }
  #hud-hint { position:absolute; left:16px; bottom:16px; font-size:12px; opacity:.65; }
  #hud-abilities { position:absolute; left:16px; bottom:40px; display:flex; gap:8px; }
  .ab { width:96px; background:rgba(243,241,231,.88); border:1px solid rgba(32,36,42,.45); padding:4px 7px; font-size:11px; }
  .ab-key { display:inline-block; min-width:16px; text-align:center; background:var(--ink); color:var(--paper); font-weight:700; font-size:11px; padding:0 3px; margin-right:5px; }
  .ab-name { font-weight:700; }
  .ab-track { height:4px; background:rgba(32,36,42,.15); margin:4px 0 3px; }
  .ab-fill { height:100%; width:100%; background:var(--teal); transition:width .12s linear; }
  .ab-state { display:block; font-size:10px; opacity:.8; font-variant-numeric:tabular-nums; }
  .ab.cooling .ab-fill { background:var(--yellow); }
  .ab.cooling .ab-key { background:var(--yellow); color:var(--ink); }
  .ab.poor { border-color:var(--red); }
  .ab.poor .ab-state { color:var(--red); opacity:1; }
  .ab.near { border-color:var(--teal); box-shadow:2px 2px 0 rgba(0,127,123,.3); }
  .ab.near .ab-key { background:var(--teal); }
  .ab.near .ab-state { color:var(--teal); opacity:1; font-weight:700; }
  #hud-mid { position:absolute; left:50%; top:0; transform:translateX(-50%); text-align:center; width:340px; }
  #objective { font-size:15px; font-weight:700; background:rgba(243,241,231,.85); border:1px solid rgba(32,36,42,.4); padding:4px 12px; display:inline-block; }
  #objective small { display:block; font-size:11px; font-weight:400; opacity:.7; }
  #anchor-chips { display:flex; gap:6px; justify-content:center; margin-top:6px; }
  .chip { width:74px; background:rgba(243,241,231,.85); border:1px solid rgba(32,36,42,.4); padding:2px 6px; font-size:11px; }
  .chip span { display:block; text-align:left; }
  .chip-track { height:4px; background:rgba(32,36,42,.15); margin-top:2px; }
  .chip-fill { height:100%; width:0; background:var(--yellow); }
  .chip.done { border-color:var(--teal); color:var(--teal); }
  .chip.done .chip-fill { background:var(--teal); }
  #boss-bar { display:none; align-items:center; gap:8px; margin-top:6px; background:rgba(32,36,42,.85); color:var(--paper); padding:4px 10px; font-size:12px; }
  #boss-track { flex:1; height:8px; background:rgba(243,241,231,.25); }
  #boss-fill { height:100%; width:100%; background:var(--red); transition:width .12s linear; }
  #boss-rage { display:none; color:var(--yellow); font-weight:700; }
  #draw-hint { position:absolute; top:110px; left:50%; transform:translateX(-50%); background:rgba(0,127,123,.9); color:var(--paper); padding:4px 14px; font-size:12px; display:none; }
  #prompt { position:absolute; bottom:104px; left:50%; transform:translateX(-50%); text-align:center; display:none; }
  #prompt-text { font-size:14px; font-weight:700; background:rgba(243,241,231,.9); border:1px solid var(--ink); padding:3px 12px; }
  #use-track { width:180px; height:6px; background:rgba(32,36,42,.15); border:1px solid rgba(32,36,42,.4); margin:5px auto 0; }
  #use-fill { height:100%; width:0; background:var(--teal); }
  #end-overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(243,241,231,.88); pointer-events:auto; }
  #end-card { background:var(--paper); border:2px solid var(--ink); padding:26px 34px; text-align:center; max-width:460px; box-shadow:6px 6px 0 rgba(32,36,42,.25); }
  #end-title { font-size:28px; letter-spacing:.1em; margin-bottom:6px; }
  #end-reason { font-size:13px; opacity:.75; margin-bottom:14px; }
  #end-stats { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:10px; }
  #end-stats th, #end-stats td { border:1px solid rgba(32,36,42,.35); padding:4px 8px; }
  #end-stats th { background:rgba(32,36,42,.08); font-weight:700; }
  #end-team { font-size:14px; font-weight:700; margin-bottom:4px; }
  #end-best { font-size:12px; opacity:.8; min-height:16px; margin-bottom:14px; }
  #end-best.new-record { color:var(--teal); font-weight:700; opacity:1; }
  #restart-btn { font:inherit; font-size:15px; font-weight:700; padding:8px 26px; background:var(--teal); color:var(--paper); border:2px solid var(--ink); cursor:pointer; box-shadow:3px 3px 0 rgba(32,36,42,.35); }
  #restart-btn:hover { background:var(--ink); }
  #dmg-vignette { position:absolute; inset:0; opacity:0; box-shadow:inset 0 0 120px 40px rgba(227,75,63,.8); }
  #hud-toast { position:absolute; bottom:64px; left:50%; transform:translateX(-50%); background:rgba(32,36,42,.85); color:var(--paper); padding:6px 16px; font-size:13px; opacity:0; transition:opacity .2s; }
  #lock-hint { position:fixed; inset:0; display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; background:rgba(243,241,231,.82); pointer-events:none; }
  #lock-hint h1 { font-size:30px; letter-spacing:.12em; }
  #lock-hint p { font-size:14px; opacity:.8; }
  #lock-hint .keys { font-size:12px; opacity:.65; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="lock-hint">
  <h1>墨线突围 · 内核客户端</h1>
  <p>点击画面进入 · WASD 移动 / Shift 冲刺 / 空格跳 / 鼠标射击 / R 换弹（浏览器禁止指针锁定时自动切兼容模式）</p>
  <p class="keys">Q 两级画墙（右键取消） · E 擦除脉冲 · C 折纸切换 · F 共持锚点/撤离 · D5：全能力+全敌人 · Esc 释放鼠标</p>
</div>
<script src="/src/three/three.min.js"></script>
<script type="module" src="/client/main.mjs"></script>
</body>
</html>
